<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PowerRanking">
  <!-- The wordmark's own colours and face: --color-gold on --color-bg, in the
       site font stack, so it degrades the same way the header does where Segoe
       UI is absent. Its own dark ground rather than a transparent one, or the
       gold sits on whatever the browser's tab strip happens to be. -->
  <rect width="64" height="64" rx="12" fill="#0b0e14"/>
  <text x="32" y="32" fill="#cda45e"
        font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="29" font-weight="800" letter-spacing="1.16"
        text-anchor="middle" dominant-baseline="central">PR</text>
</svg>
