name: Deploy site

# Pages serves files, so the boards ship as files: the same queries the API
# server runs, written out once and published. Nothing runs Express in
# production -- see backend/api/src/exportStatic.ts.
#
# Exporting costs ~13 minutes and only the daily recompute changes what it would
# write, so a site-only change reuses the last export instead of rebuilding 1,228
# identical files. `refresh_data` is what says the data actually moved: the daily
# job passes true, a push does not.
on:
  workflow_call:
    inputs:
      refresh_data:
        description: Re-export from the database rather than reusing the last export.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Re-export from the database rather than reusing the last export.
        type: boolean
        default: false
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one in flight: the export is ~12
# minutes of queries and a half-published site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - run: npm ci

      # `frontend` is NOT an npm workspace, so the root install does not reach
      # it and its node_modules would not exist at all.
      - run: npm ci --prefix frontend

      # The export runs through tsx but imports both of these from their dist.
      - run: npm run build --workspace=@power-ranking/shared
      - run: npm run build --workspace=@power-ranking/rating-engine

      # Restore/save rather than the combined action, and a unique key with a
      # prefix to find the last one: cache entries are immutable, so a run that
      # re-exports cannot overwrite the key it read from.
      - name: Reuse the last export
        id: restore
        if: ${{ !inputs.refresh_data }}
        uses: actions/cache/restore@v4
        with:
          path: site-data
          key: site-data-${{ github.run_id }}
          restore-keys: site-data-

      # ~13 minutes: 1,228 documents, each a board query against the free-plan
      # instance. Do not widen the export's concurrency to speed this up -- it
      # is measured to make it far slower. Runs when the data moved, and also
      # when there is no cache to reuse -- an evicted entry must not silently
      # publish a site with no boards in it.
      - name: Export the boards
        id: export
        if: ${{ inputs.refresh_data || !steps.restore.outputs.cache-matched-key }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run export --workspace=@power-ranking/api -- ../../site-data

      - name: Save the export
        if: steps.export.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: site-data
          key: site-data-${{ github.run_id }}

      # Deploying an empty site is far worse than not deploying: it replaces a
      # working board with nothing, and the next run is a day away.
      - name: Check there is something to publish
        run: |
          test -s site-data/leagues.json || { echo "::error::no export to publish"; exit 1; }
          echo "publishing $(find site-data -type f | wc -l) documents"

      # The site lives at /power-ranking/, so the app resolves both its own
      # assets and every data file against that base. Through the package's own
      # `build` script, not `npx ng`: npx resolves binaries from the working
      # directory regardless of --prefix, so it cannot see frontend's.
      - name: Build the app
        run: npm run build --prefix frontend -- --base-href /power-ranking/

      - name: Assemble
        run: node scripts/assembleSite.mjs frontend/dist/frontend/browser site-data site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
