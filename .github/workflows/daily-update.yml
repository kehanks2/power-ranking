name: Daily update

on:
  schedule:
    # 17:00 UTC — noon CDT, 11:00 CST once the US leaves daylight time, since
    # Actions cron is UTC and does not shift. Liquipedia dates a series by its
    # start, so the job's cutoff is whole dates only: a date's last series
    # finishes at most 02:15 UTC the next day, and results appear 3-6h after a
    # match ends, so this clears the worst case by ~9 hours. Note GitHub
    # disables schedules on a repository with no activity for 60 days.
    #
    # The minute is not a lever. It was ':37' to dodge the scheduler's most
    # contended minute, but Actions queues scheduled runs by load, not by the
    # minute asked for: over 2026-08-20..29 the requested 14:37 was served
    # anywhere from 14:52 to 23:55 UTC. The margin above is what actually
    # absorbs that, so pick a legible hour and let it drift.
    #
    # ONE run a day. A 429 is retried in-process on a bounded backoff, and a
    # lost day costs freshness, not data: the window starts from the newest game
    # HELD, not from today, so the next run asks for everything the failed one
    # missed. A second daily cron was neither of those things -- it re-pulled an
    # identical window whether or not the first run needed help.
    - cron: '0 17 * * *'
  workflow_dispatch:

# Two runs at once would have two recomputes writing the rating tables
# simultaneously, and each one deletes before it inserts.
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Ingestion runs through tsx, but imports both of these from their dist.
      - run: npm run build --workspace=@power-ranking/shared
      - run: npm run build --workspace=@power-ranking/rating-engine

      # The limiter keeps its sliding window and any hard block in a file, which
      # the runner discards with itself -- so unattended runs were the only ones
      # with no memory of a 429. Restore/save rather than the combined action:
      # the state most worth carrying is a hard block, and a run that hard-blocks
      # is a run that FAILED, which the combined action's post step skips.
      - name: Restore the Liquipedia rate-limit budget
        uses: actions/cache/restore@v4
        with:
          path: .liquipedia-rate-limit.json
          # Unique per run because cache entries are immutable; the prefix is
          # what actually finds the previous run's file.
          key: liquipedia-rate-limit-${{ github.run_id }}
          restore-keys: liquipedia-rate-limit-

      # Exits non-zero on a partial pull, naming the series for the next run.
      - name: Pull and recompute
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LIQUIPEDIA_API_KEY: ${{ secrets.LIQUIPEDIA_API_KEY }}
        run: npm run daily --workspace=@power-ranking/ingestion

      - name: Save the Liquipedia rate-limit budget
        if: always() && hashFiles('.liquipedia-rate-limit.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .liquipedia-rate-limit.json
          key: liquipedia-rate-limit-${{ github.run_id }}
