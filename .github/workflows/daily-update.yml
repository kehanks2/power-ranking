name: Daily update

on:
  schedule:
    # ~14:00 UTC. Liquipedia dates a series by its start, so the job's cutoff is
    # whole dates only: a date's last series finishes at most 02:15 UTC the next
    # day, and results appear 3-6h after a match ends, so this clears the worst
    # case by ~12 hours. GitHub starts scheduled runs late under load, which the
    # same margin absorbs. Note GitHub disables schedules on a repository with
    # no activity for 60 days.
    #
    # Deliberately NOT on the hour. Actions runners share egress IPs, Liquipedia
    # throttles on them, and '0 14' put us in the most contended minute of the
    # scheduler alongside every other cron hitting the same APIs -- the
    # 2026-08-17 run took a 429 on its first call.
    - cron: '37 14 * * *'
    # Second attempt, a different hour so it draws a fresh rate-limit budget. A
    # 429 from a shared IP is transient, and a re-run after a good one is close
    # to free: ingestion upserts, and only the newest run per data frontier is
    # retained, so the carets see one generation either way.
    - cron: '23 17 * * *'
  workflow_dispatch:

# Two runs at once would have two recomputes writing the rating tables
# simultaneously, and each one deletes before it inserts.
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Ingestion runs through tsx, but imports both of these from their dist.
      - run: npm run build --workspace=@power-ranking/shared
      - run: npm run build --workspace=@power-ranking/rating-engine

      # Exits non-zero on a partial pull, naming the series for the next run.
      - name: Pull and recompute
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LIQUIPEDIA_API_KEY: ${{ secrets.LIQUIPEDIA_API_KEY }}
        run: npm run daily --workspace=@power-ranking/ingestion
